# Etapa 2 — presupuesto y optimización COMUNES a los cuatro modelos (docs/metodologia.md §2.3 y §4).
#
# Todo lo que está aquí es igual para LLaVA-OV, InternVL3, Qwen3.5 y VL-JEPA: esa es la definición
# operativa de "mismo presupuesto" (CLAUDE.md §3, comparabilidad). Lo que cambia por modelo vive en
# configs/train/models/<modelo>.yaml y está restringido a las claves de
# `vlmfid.train.config.ALLOWED_MODEL_KEYS` (micro-lote, conector, objetivo, criterio de selección y el
# LR que gane el barrido). Cualquier otra clave en esos archivos se rechaza.
#
# Protocolo (fijo, de los papers o de decisiones del usuario):
#   * objetivo: el caption ORIGINAL de M3DI, con sus 5 plantillas (CLAUDE.md §3)
#   * prompt: p1_attributes en los 4 modelos (decisión del usuario; M §2.3)
#   * QLoRA: base en NF4 + doble cuantización, cómputo bf16 [8, Ap. B.2]; control bf16 con model.quant=bf16 (D6)
#   * entrenables: LoRA en todas las lineales del LLM / Predictor (+ Y-Encoder en VL-JEPA) y conector completo
#   * presupuesto: 1 época de train (125 000 imágenes), mismo lote efectivo (CLAUDE.md §3; [5] §4.5)
#   * selección: VLM por attr_mean en val; VL-JEPA por la InfoNCE en val (P7, decisión del usuario 16-11-2026)
#
# Hiperparámetros: propuesta CONFIRMADA por el usuario el 20-11-2026 (P5′, M §6.1), salvo P8 (lote) y lo que
# elige la grilla (LR, r, conector). Historia: decisión del 16-11-2026 (código + propuesta citada, y
# grilla corta en val de LR × r × conector, configs/train/grid.yaml, 20-11-2026). Mientras `train.hparams_confirmed` sea
# false, `compose_train` solo deja lanzar corridas cortas (con train.max_steps): humo y barrido.
#
# Uso: uv run --no-sync python scripts/train.py model=<llava_ov|internvl3|qwen35|vljepa> [clave=valor ...]

exp_id: null            # null -> train_<model>_<quant>_<prompt>_r<r>_lr<lr>_e<epochs>[_s<seed>][_m<max_steps>]
stage: finetuned
seed: 0
prompt: p1_attributes   # decisión del usuario: el mismo prompt en los 4 modelos (no el mejor zero-shot)

data:
  dataset: m3di
  variant: base
  root: null            # null -> M3DI_ROOT
  train_split: train    # siempre completo (125 000); no hay train_limit (compose_train lo rechaza)
  val_split: val        # test nunca: solo scripts/final_test.py lo lee
  val_limit: 500        # P1: mismas 500 imágenes de val durante el ajuste para los 4 modelos
  subset_seed: 0
  num_workers: 4

train:
  hparams_confirmed: false      # true tras P8 y con el ganador de la grilla anotado en configs/train/models/ (P5 ya confirmado)
  epochs: 1                     # CLAUDE.md §3
  # P8 (20-11-2026): 64 para los cuatro, por la regla acordada. La propuesta era 128 (comparación controlada de
  # [5] §4.5), pero VL-JEPA necesita lote FÍSICO = efectivo (InfoNCE toma los negativos del lote, M §2.3) y con
  # 128 dio OOM en el humo, en NF4 y en bf16 (pide 2.05 / 4.10 GiB con ≈ 22 GB ocupados). 64 es el lote con que
  # se entrenó el checkpoint de open-vljepa (configs/stage_b_retrain.yaml del submódulo).
  # 125 000 = 1 953·64 + 8 -> 1 954 pasos por época.
  effective_batch_size: 64
  micro_batch_size: null        # lo fija configs/train/models/<modelo>.yaml (solo memoria)
  drop_last: false              # se usan las 125 000 imágenes; el último paso lleva el resto
  optimizer: adamw              # CONFIRMADO (P5′, 20-11-2026). [8] usa paged AdamW, crítico solo en 33B/65B (§4); con 0.5-1B el
                                #   estado del optimizador es chico. adamw | paged_adamw
  # LR de LoRA. POR GRILLA (configs/train/grid.yaml), por modelo: {1e-4, 2e-4, 5e-4}. 2e-4 es el de [8] Tabla 9
  # para 7B/13B; 1e-4 el de 33B/65B. El ganador por modelo va a configs/train/models/<modelo>.yaml.
  lr: 2.0e-4
  # Conector y proyecciones de VL-JEPA, como múltiplo del LR de LoRA. POR GRILLA {1, 5} (G1). 1.0: open-vljepa entrena
  # vis_proj y out_proj con el LR base del Predictor (scripts/train.py::build_optimizer del submódulo); los
  # papers de los VLM no cubren "conector + LoRA" (M §4).
  connector_lr_mult: 1.0
  # VL-JEPA: LoRA del Y-Encoder con LR × 0.05 ([5] §3.1, Tabla 7b). La cabeza y_encoder.projector va con el
  # conector, a LR completo (P9, decisión del usuario 16-11-2026). Nota: open-vljepa la entrena a × 0.05.
  y_encoder_lr_mult: 0.05
  weight_decay: 0.0             # CONFIRMADO (P5′). Sin weight decay en LLaVA [2, Ap.]
  betas: [0.9, 0.999]           # β₂ = 0.999 [8, Ap. B.2]
  eps: 1.0e-8
  schedule: cosine              # CONFIRMADO (P5′). coseno con calentamiento 3 % [2, Ap.]; VL-JEPA SFT también usa
                                #   coseno [5] §3.2. Alternativa: constant [8, Ap. B.2]
  warmup_ratio: 0.03            # [2, Ap.]; ≈ 59 de 1 954 pasos
  min_lr_ratio: 0.0
  max_grad_norm: 0.3            # CONFIRMADO (P5′). [8, Ap. B.2]. Revisar grad_norm del humo antes de la grilla
  max_target_tokens: 64         # cota de seguridad: el caption más largo tiene 31 tokens; si alguno excede, falla
  gradient_checkpointing: true
  x_encoder_chunk: 32           # VL-JEPA: el X-Encoder (congelado, sin gradiente) se pasa en trozos de este tamaño;
                                #   no cambia la pérdida, solo la memoria pico
  eval_every: 200               # pasos entre evaluaciones en val (+ paso 0 y el último) -> ~10 por época
                                #   (era 100 con lote 128; se duplica con P8 = 64 para conservar ~10 evaluaciones)
  eval_at_start: true           # paso 0 = modelo base con el adaptador en cero (control de paridad con la etapa 1)
  save_every: 100               # pasos entre checkpoints de reanudación
  log_every: 10
  max_steps: null               # corridas cortas (humo, barrido): corta el run Y el schedule (exp_id ..._m<N>)
  selection_metric: attr_mean   # VLM: attr_mean (máx.). VL-JEPA: val_loss (mín.), en su archivo de modelo (P7)

lora:
  # α y dropout CONFIRMADOS (P5′, 20-11-2026); r por grilla {16, 64}. Valores de [8, Ap. B.2] para ≤ 13B (los mismos que el Y-Decoder). [8, Ap. A.2]: r no
  # importa si LoRA va en todas las capas, con evidencia en 7B. Sin barrido de r.
  r: 64
  alpha: 16
  dropout: 0.1
  bias: none
  connector_modules: []         # lo fija el archivo del modelo

objective:
  kind: lm                      # lm (VLM autorregresivo) | infonce (VL-JEPA)
  temperature: 0.07             # CONFIRMADO, fija (P5′). Solo infonce: la del checkpoint (open-vljepa configs/stage_b_retrain.yaml); M §4
  mask_duplicate_captions: false   # D4: sin máscara con lote físico ≤ 128; se reporta la tasa de duplicados

# VL-JEPA (open-vljepa, MSRVTT Stage B) — etapa 2. Solo claves permitidas (ver configs/train/budget.yaml).
#
# Prompt: la regla "mejor zero-shot" elige p4m_multiexample (Índice macro 0,2910), pero en VL-JEPA
# los seis prompts quedaron entre 0,285 y 0,291, dentro del ruido: la consulta casi no cambia ŝ_Y.
# Ojo: p4m tiene 329 caracteres / 61 palabras con nombres como "xkcd:light blue" (≈80-90 tokens de Llama-3,
# estimado) y max_query_len = 64 (el del checkpoint, igual que en la etapa 1): lo más probable es que la
# cola del prompt se trunque, igual que en la etapa 1. El conteo exacto queda en status.json
# (model_info.query_tokens / query_truncated) al iniciar el entrenamiento.
prompt: p4m_multiexample

train:
  # InfoNCE: los negativos son las otras muestras del MISMO micro-lote, así que el micro-lote debe ser
  # igual al lote efectivo (64, como el preentrenamiento del checkpoint). Acumular gradientes NO es
  # equivalente aquí; el loop no parte este lote ante un OOM, falla con un mensaje.
  micro_batch_size: 64

lora:
  connector_modules: [vis_proj]   # predictor.vis_proj: Linear 1024 -> 2048 (V-JEPA 2 -> Llama)

objective:
  kind: infonce

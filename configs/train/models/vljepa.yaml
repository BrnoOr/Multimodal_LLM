# VL-JEPA (open-vljepa, MSRVTT Stage B) — etapa 2, opción A del paper (docs/metodologia.md §2.3, C7/D3).
# Solo claves permitidas (vlmfid.train.config.ALLOWED_MODEL_KEYS).
#
#   X-Encoder   congelado, NF4                                  [5] §3.1
#   Predictor   LoRA en las 8 capas (LR base)                   [5] §3.1 (ajuste completo -> LoRA, D3)
#   Y-Encoder   LoRA en EmbeddingGemma con LR × 0.05            [5] §3.1, Tabla 7b
#   proyecciones vis_proj, out_proj, y_encoder.projector completas, LR del conector (P9: también la del Y-Encoder)
#   pérdida     InfoNCE bidireccional del lote, sin máscara de duplicados (D4)

train:
  # InfoNCE toma los negativos del lote: el micro-lote DEBE ser el lote efectivo (compose_train lo exige).
  micro_batch_size: 64     # = lote efectivo (P8)
  # P7 (decisión del usuario, 16-11-2026): durante el ajuste no hay Y-Decoder válido (el Y-Encoder cambia),
  # así que el paso se elige por la InfoNCE en val (mínima). Diferencia declarada frente a los VLM.
  selection_metric: val_loss
  # GANADOR de la grilla (s2_grid_vljepa, 22-11-2026; docs/resultados_etapa2.md §3): InfoNCE val 0.6326 en el paso 150.
  # Queda en el BORDE del eje de LR (5e-4 es el máximo): aceptado y declarado (G5, usuario 22-11-2026).
  lr: 5.0e-4
  connector_lr_mult: 1.0

lora:
  r: 64                     # ganador de la grilla (α = 16 queda común, budget.yaml)
  connector_modules: [predictor.vis_proj, predictor.out_proj, y_encoder.projector]

objective:
  kind: infonce

# LLaVA-OneVision-0.5B — etapa 2. Solo claves permitidas (vlmfid.train.config.ALLOWED_MODEL_KEYS).
# El presupuesto, el prompt (p1_attributes) y los hiperparámetros comunes están en configs/train/budget.yaml.

train:
  # Solo memoria: no cambia la matemática (la pérdida se normaliza por los tokens del lote efectivo).
  # ≈1 500 tokens visuales por imagen (AnyRes): las secuencias más largas de los 4. Si hay OOM el bucle
  # lo parte solo y lo registra.
  micro_batch_size: 8
  # lr: <ganador de la grilla>   (configs/train/grid.yaml; scripts/summarize_train.py --winners)
  # connector_lr_mult: <ganador de la grilla>

lora:
  # r: <ganador de la grilla>   (α = 16 queda común, budget.yaml)
  connector_modules: [multi_modal_projector]   # MLP de 2 capas SigLIP -> Qwen2 (model.multi_modal_projector)

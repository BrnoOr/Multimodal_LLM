# Qwen3.5-0.8B-Base — etapa 2. Solo claves permitidas (vlmfid.train.config.ALLOWED_MODEL_KEYS).
# El presupuesto, el prompt (p1_attributes) y los hiperparámetros comunes están en configs/train/budget.yaml.
# LoRA: el regex de configs/models/qwen35.yaml (atención completa, Gated DeltaNet y MLP del language_model;
# 186 lineales, docs/resultados_etapa1.md §7.2).

train:
  micro_batch_size: 32      # solo memoria; ≈64 tokens visuales por imagen
  # GANADOR de la grilla (s2_grid_vlm, 21-11-2026; docs/resultados_etapa2.md §2): attr_mean 0.7930 en el paso 150, EMPATE exacto con r64·×5: desempate por parsimonia
  lr: 1.0e-4
  connector_lr_mult: 1.0

lora:
  r: 16                     # ganador de la grilla (α = 16 queda común, budget.yaml)
  connector_modules: [visual.merger]   # fusión 2×2 de parches + MLP hacia el LM (dentro del módulo visual)

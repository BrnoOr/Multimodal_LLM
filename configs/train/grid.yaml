# Grilla de hiperparámetros de la etapa 2 (docs/metodologia.md §4 y §6.1). La expande scripts/make_grid.py en
# configs/queues/stage2_grid.txt. Reemplaza al barrido de solo LR (stage2_sweep.txt, en _para_borrar/).
#
# Decisiones del usuario (20-11-2026):
#   * grilla COMPLETA (producto cartesiano) sobre LR × r × multiplicador del conector;
#   * ganador POR MODELO (cada modelo su combinación): diferencia de protocolo entre modelos que se declara;
#   * solo NF4; el control bf16 hereda la combinación ganadora de NF4 (como P10 con el LR);
#   * mismo procedimiento corto que el barrido de LR acordado el 16-11-2026: 150 pasos × lote efectivo, con el
#     schedule completo dentro de la corrida, evaluación en las 500 de val cada 50 pasos.
#
# Regla de selección (igual que el barrido de LR): la métrica en el ÚLTIMO paso evaluado, no la mejor:
#   VLM      mayor attr_mean            VL-JEPA  menor InfoNCE en val (P7)
# Sin parada temprana (G2, docs/metodologia.md §6.1, 20-11-2026): toda combinación corre los 150 pasos; las
# evaluaciones intermedias solo se registran. Se descartó successive halving (presupuestos distintos por combinación).
# El ganador de cada modelo va a configs/train/models/<modelo>.yaml (train.lr, lora.r, train.connector_lr_mult).
#
# Costo: 3 × 2 × 2 = 12 combinaciones por modelo, 48 corridas, 48 × 150 × 128 ≈ 922 000 imágenes (≈ 7 épocas de
# train). La corrida final es 1 época.

steps: 150                  # pasos por combinación (barrido de LR, 16-11-2026)
eval_every: 50
quant: nf4
models: [vljepa, qwen35, internvl3, llava_ov]

axes:
  # LR de LoRA: {1e-4, 2e-4, 5e-4} alrededor de 2e-4 de [8] Tabla 9 (7B/13B); 1e-4 es el de 33B/65B.
  train.lr: [1.0e-4, 2.0e-4, 5.0e-4]
  # Rango de LoRA con α = 16 FIJO (budget.yaml): 64 es el de [8] Ap. B.2 (7B–65B); 16 es propuesta propia.
  # Convención de LoRA [Hu et al., 2106.09685, §4.1]: α se fija y la escala α/r evita reajustar el LR al cambiar r.
  lora.r: [16, 64]
  # Multiplicador del LR del conector sobre el de LoRA. Ningún paper cubre "conector + LoRA":
  #   1  open-vljepa (vis_proj y out_proj con el LR base del Predictor)
  #   5  ≈ 1e-3 / 2e-4: LR del proyector de LLaVA-OV 0.5B [2408.03326, Tabla 1] sobre el LR de LoRA de [8]
  train.connector_lr_mult: [1.0, 5.0]

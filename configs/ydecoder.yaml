# (No va en configs/models/: no es un modelo evaluado, es el lector de VL-JEPA.)
# Y-Decoder de VL-JEPA: prefijo sobre Llama-3.2-1B (docs/metodologia.md §2.4; vlmfid.models.ydecoder).
# DISEÑO PROPIO: el paper de VL-JEPA no especifica el decodificador.
#
# Procedencia de cada valor (ningún paper cubre este componente a esta escala):
#   lora.*, train.lr, train.batch_size, train.schedule, train.max_grad_norm, train.betas
#       QLoRA (Dettmers et al., 2023), Ap. B.2 y Tabla 9, medidos en LLaMA 7B/13B. Se usan como PUNTO DE
#       PARTIDA acordado con el usuario, no como valores justificados para un LM de 1B.
#   text_source, msrvtt.*
#       decisión del usuario (16-11-2026, docs/metodologia.md §2.4): el decodificador de la etapa 1 es
#       GENÉRICO, entrenado con captions de MSR-VTT (train_7k, el corpus del checkpoint), y se elige por
#       CIDEr en MSR-VTT test_1k; no ve M3DI. Los decodificadores ajustados a M3DI (condición intermedia y
#       etapa 2) continúan desde él con text_source=m3di e init_from=<decoder genérico>.
#   prefix_len, epochs
#       sin fuente. Decodificador genérico: barrido de k ∈ {1, 4, 8} con 1 época en MSR-VTT
#       (configs/queues/ydecoder_msrvtt.txt) y el ganador hasta 3 épocas, eligiendo el mejor paso.
#       k = 8: mejor CIDEr en MSR-VTT test_1k con 1 época (k=1 1.321, k=4 1.384, k=8 1.439; adelante en
#       las 7 evaluaciones). train.epochs = 20 es el de los decodificadores ajustados a M3DI (decisión 20-11).
#   train.noise_std = 0
#       sin ruido: el protocolo entrena con S_Y limpio (docs/metodologia.md §2.4).
decoder:
  name: ydecoder_llama32_1b
  llama_name: unsloth/Llama-3.2-1B     # mismo LM de origen que el Predictor; réplica sin restricción de acceso
  quant: nf4                            # nf4 | bf16 (control sin cuantizar)
  embed_dim: 1536                       # espacio compartido de VL-JEPA
  prefix_len: 8                         # k vectores de prefijo: ganador del barrido en MSR-VTT (16-11-2026)
  normalize_input: true                 # el embedding entra con norma 1 (ver vlmfid.models.ydecoder)
  text_source: msrvtt                   # msrvtt (genérico, etapa 1) | m3di (ajustado: intermedia y etapa 2)
  init_from: null                       # runs/<ydec_...>/decoder_best para continuar desde ese decodificador
  msrvtt:                               # solo con text_source=msrvtt (vlmfid.data.msrvtt)
    repo: friedrichor/MSR-VTT
    train_file: msrvtt_train_7k.json    # 140 200 captions: entrenamiento
    val_file: msrvtt_test_1k.json       # 1 000 captions que VL-JEPA no vio: eligen el paso (CIDEr)
    val_limit: null                     # null = los 1 000
    epochs: 3                           # el barrido de k usa 1 (override en la cola)
    eval_every: 1000                    # ~7 evaluaciones por época (7 381 pasos: 118 094 captions distintos, lote 16)
    m3di_report_limit: 500              # techo en val de M3DI medido en cada evaluación, SOLO para reportar
  lora:
    r: 64
    alpha: 16
    dropout: 0.1
  generation:
    max_new_tokens: 256                 # igual que los VLM (configs/models/*.yaml)
  train:
    lr: 2.0e-4                          # LoRA y proyección de prefijo
    batch_size: 16
    epochs: 20                          # text_source=m3di: sobre los captions distintos de train de M3DI; se
                                        # elige el mejor paso en val. Decisión del usuario (20-11-2026): el run
                                        # de 10 épocas desde cero seguía subiendo ≈ +0.015 por época al final
                                        # (0.718 a 3 ép., 0.906 a 10; resultados §7b); 20 es un tope holgado,
                                        # con selección del mejor paso. ≈ 1 h 40 min con k = 8.
    schedule: constant
    betas: [0.9, 0.999]
    weight_decay: 0.0
    max_grad_norm: 0.3
    noise_std: 0.0
    eval_every: 200                     # text_source=m3di: pasos entre evaluaciones en val
    val_limit: 500                      # text_source=m3di: imágenes de val para elegir el paso (subconjunto determinista)
    log_every: 20

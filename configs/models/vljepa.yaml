# VL-JEPA: reimplementación abierta open-vljepa, checkpoint MSRVTT Stage B (docs/metodologia.md §1.5).
# X-Encoder V-JEPA 2 ViT-L (congelado) + Predictor (últimas 8 capas de Llama-3.2-1B) + Y-Encoder
# EmbeddingGemma-300M. Predice un embedding; el texto lo produce un Y-Decoder aparte (§2.4).
name: vljepa_open_msrvtt
family: vljepa
repo_path: external/open-vljepa          # submodule fijado a un commit
hf_id: cun-bjy/open-vljepa               # de aquí se descarga best.pt si ckpt_path es null
ckpt_file: best.pt
ckpt_path: null
revision: null
# Arquitectura y tokenizador del predictor. null -> el del checkpoint (meta-llama/Llama-3.2-1B,
# requiere aprobación de Meta). La réplica de unsloth declara los mismos pesos y tokenizador
# (sin verificar: ver docs/auditoria.md).
llama_name: unsloth/Llama-3.2-1B
# NF4 en X-Encoder, capas del Predictor y transformer del Y-Encoder; las proyecciones lineales
# (vis_proj, out_proj, y_encoder.projector) quedan en precisión completa. Control: quant: bf16.
quant: nf4
batch_size: 32
num_frames: null        # null -> el del checkpoint (8): imagen tratada como video estático
image_size: null        # null -> 256
# Longitudes máximas en tokens. Si un texto excede el límite, el adaptador falla (no trunca).
# max_query_len: 512 es el valor del paper (VL-JEPA §3.1). El checkpoint se entrenó con 64, pero los
# prompts con ejemplos no caben en 64; las posiciones de relleno van enmascaradas, así que subir el
# límite no cambia la entrada de los prompts cortos. Decisión del usuario: mismos prompts para los 4
# modelos. scripts/inspect_models.py mide los tokens reales de cada prompt y de los captions.
max_query_len: 512
max_caption_len: 96
# El checkpoint vio consultas tipo "Describe the image." en entrenamiento. Con null se usa el prompt
# del experimento; fijarlo aísla el efecto del prompt.
query_override: null
return_embeddings: true # Ŝ_Y por imagen; se guarda en runs/<exp>/embeddings si infer.save_embeddings=true
adapter_path: null
# Y-Decoder entrenado (runs/<ydec...>/decoder_best). null -> describe() falla: VL-JEPA no genera texto.
decoder_path: null

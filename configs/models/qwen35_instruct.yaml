# Control opcional: Qwen3.5-0.8B con ajuste por instrucciones (derivado del mismo preentrenamiento que qwen35.yaml).
# La diferencia Base vs Instruct en la etapa 1 mide cuánto del error zero-shot de la versión Base
# se debe a no seguir instrucciones y no a la percepción. No está en las colas por defecto.
name: qwen35_08b_instruct
family: qwen_vl
hf_id: Qwen/Qwen3.5-0.8B
revision: null
model_class: AutoModelForImageTextToText
quant: nf4
quant_skip_modules: ['.*\.visual', 'lm_head']
vision_modules: [visual]
attn_implementation: sdpa
use_kernels: false
min_pixels: null
max_pixels: null
chat_template_kwargs:
  enable_thinking: false
batch_size: 64
generation:
  max_new_tokens: 128
  do_sample: false
  num_beams: 1
lora_target_modules: '.*language_model.*\.(q_proj|k_proj|v_proj|o_proj|in_proj_qkv|in_proj_z|out_proj|gate_proj|up_proj|down_proj)$'
adapter_path: null

[project]
name = "vLLM"
version = "0.1.0"
description = "Fidelidad de descripciones de VLMs autorregresivos vs VL-JEPA sobre Multimodal3DIdent (EL7006, T7)"
requires-python = ">=3.11,<3.13"
dependencies = [
    # PyTorch: el build (cu128 / cu126) se resuelve por plataforma en [tool.uv.sources]
    "torch>=2.7",
    "torchvision",
    # Modelos y adaptación
    "transformers>=4.51",
    "accelerate",
    "peft",
    "datasets",
    "safetensors",
    # Datos y configuración
    "pillow",
    "polars",
    "pyarrow",
    "hydra-core",
    "omegaconf",
    "python-dotenv",
    "tqdm",
]

[project.optional-dependencies]
# NF4 (QLoRA). Tiene wheels para Windows y Linux; es el esquema de cuantización común a los tres modelos.
quant = ["bitsandbytes>=0.45"]
# AWQ: solo Linux y solo si la wheel precompilada resuelve sin compilar (el cluster no tiene nvcc).
awq = ["autoawq; sys_platform == 'linux'"]
qwen = ["qwen-vl-utils"]
eval = ["evaluate", "sacrebleu", "rouge-score", "pycocoevalcap", "nltk"]
track = ["wandb"]
dev = ["pytest", "ruff", "ipykernel", "jupyter"]

[tool.uv.sources]
# Laptop Windows: RTX 5090 (Blackwell, sm_120) -> requiere cu128 y driver >= 570.
# Cluster Linux : RTX 4090 (Ada, sm_89), driver 550 (CUDA 12.4) -> cu126.
# Si trabajas desde WSL2 en el laptop, este marcador te daria cu126: instala torch cu128 aparte (ver SETUP.md).
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vlmfid"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

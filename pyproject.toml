[project]
name = "vlmfid"
version = "0.2.0"
description = "Fidelidad de descripciones de VLMs sobre Multimodal3DIdent (EL7006, UChile)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7",
    "torchvision>=0.22",
    # >= 5.17: Qwen3.5 (Qwen3_5ForConditionalGeneration). v5 también trae InternVL-HF,
    # LLaVA-OneVision, V-JEPA 2 y EmbeddingGemma nativos; open-vljepa usa la firma de capas v5
    "transformers>=5.17,<6",
    "accelerate>=1.2",
    "peft>=0.15",
    "huggingface-hub>=0.34",
    "safetensors",
    "sentencepiece",
    "omegaconf>=2.3",
    "numpy>=1.26",
    "polars>=1.0",          # manifiestos en Parquet
    "pandas>=2.2",          # notebooks
    "pillow>=10",
    "pyyaml>=6",
    "tqdm",
]

[project.optional-dependencies]
quant = ["bitsandbytes>=0.46"]          # >=0.45 soporta Blackwell (sm_120)
eval  = ["sacrebleu", "rouge-score", "pycocoevalcap"]
track = ["wandb"]
# Kernels Triton para las capas Gated DeltaNet de Qwen3.5 (sin compilar; sin él se usa PyTorch).
# Fijado a 0.4.2: la 0.5.0 produce salidas corruptas ("!!!!") con entradas multimodales.
linattn = ["flash-linear-attention==0.4.2"]
dev   = ["pytest", "ruff", "ipykernel", "matplotlib", "seaborn", "nbformat"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vlmfid"]

# --- Build de PyTorch por plataforma: laptop Windows (5090, sm_120) -> cu128; cluster Linux (driver 550) -> cu126
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
